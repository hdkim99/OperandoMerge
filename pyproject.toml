[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "operandomerge"
version = "0.1.0"
description = "Synchronize heterogeneous experimental data onto one reproducible timeline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "OperandoMerge contributors" }]
keywords = ["operando", "catalysis", "synchronization", "scientific-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
operandomerge = "operandomerge.cli:main"
operandomerge-gui = "operandomerge.gui:main"

[project.urls]
Homepage = "https://github.com/hdkim99/OperandoMerge"
Issues = "https://github.com/hdkim99/OperandoMerge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/operandomerge"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["operandomerge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
