name: Scientific definition or result question
description: Ask about clocks, alignment, delays, interpolation, provenance, or merged values.
title: "science: "
body:
  - type: markdown
    attributes:
      value: Do not attach confidential or unpublished measurements. Use a hand-checkable minimal example.
  - type: input
    id: analysis
    attributes:
      label: Metric / analysis
      placeholder: "timestamp normalization, offset, delay, discrete semantics, ..."
    validations:
      required: true
  - type: textarea
    id: expected_definition
    attributes:
      label: Expected definition or transformation direction
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
    validations:
      required: true
  - type: input
    id: basis
    attributes:
      label: Input clock basis / channel semantics
      placeholder: "timezone, elapsed/local/absolute, continuous/discrete, ..."
    validations:
      required: true
  - type: input
    id: units
    attributes:
      label: Units
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Reference, DOI, and relevant equation
  - type: textarea
    id: example
    attributes:
      label: Hand-checkable minimal example
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data safety
      options:
        - label: This report contains no confidential data or identifying research metadata.
          required: true
