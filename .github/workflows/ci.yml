name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: operandomerge inspect examples/reactor_logger.csv
      - run: operandomerge merge examples/example-config.json --excel /tmp/report.xlsx --plot /tmp/alignment.png
      - run: test -s /tmp/report.xlsx && test -s /tmp/alignment.png
      - if: matrix.python-version == '3.12'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - if: matrix.python-version == '3.12'
        run: >-
          xvfb-run -a python -c
          "from operandomerge.gui import create_app;
          root, app = create_app(); root.update(); root.destroy()"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv /tmp/operandomerge-clean
      - run: /tmp/operandomerge-clean/bin/pip install dist/*.whl
      - run: /tmp/operandomerge-clean/bin/operandomerge --version
