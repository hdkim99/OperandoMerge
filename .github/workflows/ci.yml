name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operandomerge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required:
    name: CI / required
    # Public fork PR code must never execute on the private DGX runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 60
    env:
      PIP_NO_CACHE_DIR: "1"
      MPLBACKEND: Agg
      CI_ENV_NAME: operandomerge-${{ github.run_id }}-${{ github.run_attempt }}-required-venv
      CI_WHEEL_ENV_NAME: operandomerge-${{ github.run_id }}-${{ github.run_attempt }}-wheel-venv
      CI_OUTPUT_NAME: operandomerge-${{ github.run_id }}-${{ github.run_attempt }}-output
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Configure and verify shared GUI runtime
        env:
          GUI_RUNTIME: /opt/catalysttwin-actions/shared-gui-runtime
        run: |
          test -d "$GUI_RUNTIME/usr/bin"
          test -d "$GUI_RUNTIME/usr/lib/aarch64-linux-gnu"
          test -d "$GUI_RUNTIME/usr/share/tcltk/tk8.6"
          export PATH="$GUI_RUNTIME/usr/bin:$PATH"
          export LD_LIBRARY_PATH="$GUI_RUNTIME/usr/lib/aarch64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export TK_LIBRARY="$GUI_RUNTIME/usr/share/tcltk/tk8.6"
          printf '%s\n' "$GUI_RUNTIME/usr/bin" >> "$GITHUB_PATH"
          printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          printf 'TK_LIBRARY=%s\n' "$TK_LIBRARY" >> "$GITHUB_ENV"
          command -v Xvfb
          command -v xvfb-run
          python -c "import tkinter; print(tkinter.TkVersion)"
      - name: Verify DGX ARM64 runner
        run: >-
          python -c
          "import platform; machine = platform.machine().lower();
          assert machine in {'aarch64', 'arm64'}, machine;
          print(platform.platform(), machine)"
      - name: Create isolated job environment
        run: python -m venv "$RUNNER_TEMP/$CI_ENV_NAME"
      - name: Install project and ARM64 wheels
        run: |
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m pip install --only-binary=:all: -e ".[dev]" twine
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m pip check
      - name: Check formatting
        run: >-
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m ruff format --check .
      - name: Lint
        run: >-
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m ruff check .
      - name: Type check
        run: >-
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m mypy src
      - name: Unit, integration, scientific, and workflow tests
        run: >-
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m pytest
      - name: Build and verify distributions
        run: |
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m build
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m twine check --strict dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME"
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/python" -m pip install --only-binary=:all: dist/*.whl
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/python" -m pip check
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/python" -c "import importlib.metadata as m, operandomerge; assert operandomerge.__version__ == m.version('operandomerge'); print(operandomerge.__version__)"
      - name: Exercise installed CLI and examples
        run: |
          mkdir -p "$RUNNER_TEMP/$CI_OUTPUT_NAME/showcase"
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/operandomerge" --help
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/operandomerge" --version
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/operandomerge" inspect examples/reactor_logger.csv
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/operandomerge" merge examples/example-config.json --excel "$RUNNER_TEMP/$CI_OUTPUT_NAME/report.xlsx" --plot "$RUNNER_TEMP/$CI_OUTPUT_NAME/alignment.png"
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/python" examples/showcase/generate_showcase.py --output-dir "$RUNNER_TEMP/$CI_OUTPUT_NAME/showcase"
          test -s "$RUNNER_TEMP/$CI_OUTPUT_NAME/report.xlsx"
          test -s "$RUNNER_TEMP/$CI_OUTPUT_NAME/alignment.png"
          test -s "$RUNNER_TEMP/$CI_OUTPUT_NAME/showcase/operandomerge-showcase.xlsx"
          test -s "$RUNNER_TEMP/$CI_OUTPUT_NAME/showcase/before-after.png"
      - name: Exercise installed GUI headlessly
        run: |
          command -v xvfb-run
          "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/python" -c "import tkinter"
          xvfb-run -a "$RUNNER_TEMP/$CI_WHEEL_ENV_NAME/bin/python" \
            tests/gui_widget_smoke.py \
            examples/example-config.json \
            "$RUNNER_TEMP/$CI_OUTPUT_NAME/gui-report.xlsx"
          test -s "$RUNNER_TEMP/$CI_OUTPUT_NAME/gui-report.xlsx"
      - name: Remove isolated environments and generated files
        if: always()
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil

          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          temp_targets = [
              (runner_temp / os.environ[name]).resolve()
              for name in ("CI_ENV_NAME", "CI_WHEEL_ENV_NAME", "CI_OUTPUT_NAME")
          ]
          if not all(target.parent == runner_temp for target in temp_targets):
              raise RuntimeError("Refusing to remove a path outside RUNNER_TEMP")
          for target in temp_targets:
              shutil.rmtree(target, ignore_errors=True)

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          relative_targets = (
              "dist",
              "build",
              ".pytest_cache",
              ".mypy_cache",
              ".ruff_cache",
              ".coverage",
              "src/operandomerge.egg-info",
          )
          workspace_targets = [(workspace / relative).resolve() for relative in relative_targets]
          workspace_targets.extend(path.resolve() for path in workspace.rglob("__pycache__"))
          for target in workspace_targets:
              if workspace not in target.parents:
                  raise RuntimeError("Refusing to remove a path outside GITHUB_WORKSPACE")
              if target.is_dir():
                  shutil.rmtree(target)
              elif target.exists():
                  target.unlink()
          PY
          test -z "$(git status --porcelain)"

  python-compatibility:
    name: CI / Python ${{ matrix.python }} compatibility
    # Apply the same fork-PR security boundary to every DGX job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dgx-spark]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      PIP_NO_CACHE_DIR: "1"
      MPLBACKEND: Agg
      CI_ENV_NAME: operandomerge-${{ github.run_id }}-${{ github.run_attempt }}-python-${{ matrix.python }}-venv
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Create isolated compatibility environment
        run: python -m venv "$RUNNER_TEMP/$CI_ENV_NAME"
      - name: Install and test the supported Python version
        run: |
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m pip install --only-binary=:all: -e ".[dev]"
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m pytest
          "$RUNNER_TEMP/$CI_ENV_NAME/bin/python" -m pip check
      - name: Remove isolated compatibility environment
        if: always()
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil

          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"]).resolve()
          target = (runner_temp / os.environ["CI_ENV_NAME"]).resolve()
          if target.parent != runner_temp:
              raise RuntimeError("Refusing to remove a path outside RUNNER_TEMP")
          shutil.rmtree(target, ignore_errors=True)

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          relative_targets = (".pytest_cache", "src/operandomerge.egg-info")
          workspace_targets = [(workspace / relative).resolve() for relative in relative_targets]
          workspace_targets.extend(path.resolve() for path in workspace.rglob("__pycache__"))
          for workspace_target in workspace_targets:
              if workspace not in workspace_target.parents:
                  raise RuntimeError("Refusing to remove a path outside GITHUB_WORKSPACE")
              if workspace_target.is_dir():
                  shutil.rmtree(workspace_target)
              elif workspace_target.exists():
                  workspace_target.unlink()
          PY
          test -z "$(git status --porcelain)"
