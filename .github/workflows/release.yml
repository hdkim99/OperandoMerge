name: Publish released package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release artifacts
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/operandomerge-release
      - run: /tmp/operandomerge-release/bin/pip install dist/*.whl
      - run: /tmp/operandomerge-release/bin/python -m pip check
      - run: >-
          /tmp/operandomerge-release/bin/python -c
          "import operandomerge; print(operandomerge.__version__)"
      - name: Verify release tag matches installed package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          INSTALLED_VERSION=$(/tmp/operandomerge-release/bin/python -c "import operandomerge; print(operandomerge.__version__)")
          test "${RELEASE_TAG}" = "v${INSTALLED_VERSION}"
      - run: /tmp/operandomerge-release/bin/operandomerge --help
      - run: >-
          /tmp/operandomerge-release/bin/operandomerge merge
          examples/showcase/config.json
          --excel /tmp/release-showcase.xlsx
          --plot /tmp/release-showcase.png
      - run: test -s /tmp/release-showcase.xlsx && test -s /tmp/release-showcase.png
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: >-
          xvfb-run -a /tmp/operandomerge-release/bin/python -c
          "from operandomerge.gui import create_app;
          root, app = create_app(); root.update(); root.destroy()"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI with trusted publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/operandomerge
    permissions:
      id-token: write # Required for PyPI trusted publishing; no API token is stored.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
